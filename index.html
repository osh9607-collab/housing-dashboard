<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 주택건설 인허가실적 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --accent: #f0883e;
    --accent2: #58a6ff;
    --accent3: #3fb950;
    --accent4: #ff7b72;
    --accent5: #d2a8ff;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .header-left { display: flex; align-items: baseline; gap: 12px; }
  .header-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .header-sub { font-size: 12px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
  .last-updated { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }

  .loading-state, .error-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { color: var(--text-secondary); font-size: 14px; }
  .error-title { color: var(--accent4); font-size: 16px; font-weight: 600; }
  .error-msg { color: var(--text-secondary); font-size: 13px; }
  .retry-btn {
    margin-top: 8px; padding: 8px 20px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .retry-btn:hover { border-color: var(--accent); color: var(--accent); }

  .controls {
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .control-label { font-size: 12px; color: var(--text-muted); }

  .range-select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-primary); padding: 6px 12px; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  .range-select:focus { outline: none; border-color: var(--accent); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .kpi-card {
    background: var(--bg);
    padding: 24px 28px;
  }

  .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--text-primary); }
  .kpi-unit { font-size: 13px; color: var(--text-secondary); margin-left: 4px; }
  .kpi-change { font-size: 12px; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
  .kpi-change.up { color: var(--accent3); }
  .kpi-change.down { color: var(--accent4); }
  .kpi-change.neutral { color: var(--text-muted); }

  .charts-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1px;
    background: var(--border);
    padding: 0;
    border-bottom: 1px solid var(--border);
  }

  .chart-panel {
    background: var(--bg);
    padding: 24px;
  }

  .chart-panel.full-width {
    grid-column: 1 / -1;
    border-top: 1px solid var(--border);
  }

  .panel-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }

  .panel-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .panel-sub { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }

  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap.tall { height: 300px; }

  .table-panel {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 400;
  }
  td {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(33,38,45,0.5);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-secondary);
  }
  tr:hover td { background: rgba(22,27,34,0.8); }
  td:first-child { color: var(--text-primary); }
  td:nth-child(2) { color: var(--accent); font-weight: 600; }

  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  }
  .badge.up { background: rgba(63,185,80,0.15); color: var(--accent3); }
  .badge.down { background: rgba(255,123,114,0.15); color: var(--accent4); }

  .footer {
    padding: 16px 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 768px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-grid { grid-template-columns: 1fr; }
    .header { padding: 16px; }
    .controls { padding: 12px 16px; }
    .table-panel { padding: 16px; }
    .footer { flex-direction: column; gap: 4px; padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-title">서울 주택건설 인허가실적</span>
    <span class="header-sub">KOSIS · 국토교통부</span>
  </div>
  <span class="last-updated" id="last-updated">—</span>
</div>

<!-- 로딩 -->
<div class="loading-state" id="loading-state">
  <div class="spinner"></div>
  <div class="loading-text">데이터 불러오는 중...</div>
</div>

<!-- 에러 -->
<div class="error-state" id="error-state" style="display:none">
  <div class="error-title">데이터 로드 실패</div>
  <div class="error-msg" id="error-msg"></div>
  <button class="retry-btn" onclick="loadData()">다시 시도</button>
</div>

<!-- 메인 -->
<div id="main-content" style="display:none">
  <div class="controls">
    <span class="control-label">기간</span>
    <select class="range-select" id="range-select" onchange="updateCharts()">
      <option value="12">최근 12개월</option>
      <option value="24">최근 24개월</option>
      <option value="36" selected>최근 36개월</option>
      <option value="0">전체</option>
    </select>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">최근월 인허가</div>
      <div class="kpi-value" id="kpi-latest">—<span class="kpi-unit">호</span></div>
      <div class="kpi-change neutral" id="kpi-mom">전월 대비 —</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">전년 동월 대비</div>
      <div class="kpi-value" id="kpi-yoy">—<span class="kpi-unit">%</span></div>
      <div class="kpi-change neutral" id="kpi-yoy-sub">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">연간 누계 (당해)</div>
      <div class="kpi-value" id="kpi-ytd">—<span class="kpi-unit">호</span></div>
      <div class="kpi-change neutral" id="kpi-ytd-sub">전년 동기 대비 —</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">12개월 평균</div>
      <div class="kpi-value" id="kpi-avg">—<span class="kpi-unit">호</span></div>
      <div class="kpi-change neutral" id="kpi-avg-sub">—</div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">월별 인허가 추이</span>
        <span class="panel-sub" id="main-chart-sub">—</span>
      </div>
      <div class="chart-wrap tall">
        <canvas id="mainChart"></canvas>
      </div>
    </div>
    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">공공/민간 비중</span>
        <span class="panel-sub">최근 12개월 누계</span>
      </div>
      <div class="chart-wrap tall">
        <canvas id="typeChart"></canvas>
      </div>
    </div>
    <div class="chart-panel full-width">
      <div class="panel-header">
        <span class="panel-title">연도별 비교</span>
        <span class="panel-sub">월별 인허가 호수 (연도 오버레이)</span>
      </div>
      <div class="chart-wrap">
        <canvas id="yoyChart"></canvas>
      </div>
    </div>
  </div>

  <div class="table-panel">
    <div class="panel-header">
      <span class="panel-title">최근 데이터 — 서울</span>
      <span class="panel-sub" id="footer-period">—</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>기준월</th>
          <th>인허가 (호)</th>
          <th>전월비</th>
          <th>전년동월비</th>
          <th>3개월 이동평균</th>
        </tr>
      </thead>
      <tbody id="data-table"></tbody>
    </table>
  </div>

  <div class="footer">
    <span>출처: 국토교통부 「주택건설 인허가실적」 · KOSIS Open API</span>
    <span id="last-updated-footer">—</span>
  </div>
</div>

<script>
const PROXY_URL = '/.netlify/functions/kosis-proxy';
const ORG_ID = '116';
const TBL_ID = 'DT_MLTM_1946';

let rawData = [];
let mainChart, typeChart, yoyChart;

const COLORS = {
  accent: '#f0883e', accent2: '#58a6ff', accent3: '#3fb950',
  accent4: '#ff7b72', accent5: '#d2a8ff', muted: '#484f58',
};
const YEAR_COLORS = ['#f0883e','#58a6ff','#3fb950','#d2a8ff','#ff7b72','#79c0ff'];

async function loadData() {
  document.getElementById('loading-state').style.display = 'flex';
  document.getElementById('error-state').style.display = 'none';
  document.getElementById('main-content').style.display = 'none';

  const now = new Date();
  const endPrd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}`;
  const url = `${PROXY_URL}?orgId=${ORG_ID}&tblId=${TBL_ID}&prdSe=M&startPrdDe=200701&endPrdDe=${endPrd}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!Array.isArray(data)) {
      throw new Error(data?.errMsg || JSON.stringify(data));
    }

    rawData = data;
    document.getElementById('last-updated').textContent =
      `갱신: ${new Date().toLocaleString('ko-KR', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    updateCharts();

  } catch(e) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = 'flex';
    document.getElementById('error-msg').textContent = `오류: ${e.message}`;
  }
}

// 서울 총계 데이터만 추출 (C3_NM=서울, C1_NM=총계, C2_NM=총계)
function getSeoulTotal() {
  return rawData
    .filter(d =>
      d.C3_NM === '서울' &&
      d.C1_NM === '총  계' &&
      d.C2_NM === '총  계'
    )
    .sort((a,b) => a.PRD_DE.localeCompare(b.PRD_DE));
}

function applyRange(data) {
  const n = parseInt(document.getElementById('range-select').value);
  if (n === 0) return data;
  return data.slice(-n);
}

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('ko-KR');
}

function fmtPct(n) {
  if (n === null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}

function updateCharts() {
  const allData = getSeoulTotal();
  if (!allData.length) {
    document.getElementById('error-state').style.display = 'flex';
    document.getElementById('error-msg').textContent = '서울 총계 데이터를 찾을 수 없습니다.';
    document.getElementById('main-content').style.display = 'none';
    return;
  }

  const ranged = applyRange(allData);
  const labels = ranged.map(d => d.PRD_DE.replace(/(\d{4})(\d{2})/, '$1.$2'));
  const values = ranged.map(d => parseFloat(d.DT) || 0);

  updateKPIs(allData);
  updateMainChart(labels, values);
  updateTypeChart(allData);
  updateYoYChart(allData);
  updateTable(allData);

  document.getElementById('main-chart-sub').textContent = `${labels[0]} ~ ${labels[labels.length-1]}`;
  document.getElementById('footer-period').textContent =
    `${allData[0].PRD_DE.replace(/(\d{4})(\d{2})/, '$1.$2')} ~ ${allData[allData.length-1].PRD_DE.replace(/(\d{4})(\d{2})/, '$1.$2')}`;
}

function updateKPIs(data) {
  const last = parseFloat(data[data.length-1]?.DT) || 0;
  const prev = parseFloat(data[data.length-2]?.DT) || 0;
  const yoyIdx = data.length - 13;
  const yoyVal = yoyIdx >= 0 ? (parseFloat(data[yoyIdx]?.DT) || 0) : null;

  const latestYear = data[data.length-1].PRD_DE.slice(0,4);
  const prevYear = String(parseInt(latestYear)-1);
  const latestMonth = parseInt(data[data.length-1].PRD_DE.slice(4,6));

  const ytd = data.filter(d => d.PRD_DE.startsWith(latestYear) && parseInt(d.PRD_DE.slice(4,6)) <= latestMonth)
    .reduce((s,d) => s + (parseFloat(d.DT)||0), 0);
  const ytdPrev = data.filter(d => d.PRD_DE.startsWith(prevYear) && parseInt(d.PRD_DE.slice(4,6)) <= latestMonth)
    .reduce((s,d) => s + (parseFloat(d.DT)||0), 0);

  const last12 = data.slice(-12).map(d => parseFloat(d.DT)||0);
  const avg12 = last12.reduce((a,b)=>a+b,0) / last12.length;

  const momPct = prev ? ((last-prev)/prev*100) : null;
  const yoyPct = yoyVal ? ((last-yoyVal)/yoyVal*100) : null;
  const ytdPct = ytdPrev ? ((ytd-ytdPrev)/ytdPrev*100) : null;

  document.getElementById('kpi-latest').innerHTML = `${fmt(last)}<span class="kpi-unit">호</span>`;
  const momEl = document.getElementById('kpi-mom');
  momEl.textContent = momPct !== null ? `전월 대비 ${fmtPct(momPct)}` : '전월 데이터 없음';
  momEl.className = `kpi-change ${momPct > 0 ? 'up' : momPct < 0 ? 'down' : 'neutral'}`;

  const yoyEl = document.getElementById('kpi-yoy');
  yoyEl.innerHTML = yoyPct !== null ? `${fmtPct(yoyPct).replace('%','')}<span class="kpi-unit">%</span>` : `—<span class="kpi-unit">%</span>`;
  yoyEl.style.color = yoyPct > 0 ? COLORS.accent3 : yoyPct < 0 ? COLORS.accent4 : COLORS.accent;
  document.getElementById('kpi-yoy-sub').textContent = yoyVal ? `전년 동월 ${fmt(yoyVal)}호` : '—';

  document.getElementById('kpi-ytd').innerHTML = `${fmt(ytd)}<span class="kpi-unit">호</span>`;
  const ytdSubEl = document.getElementById('kpi-ytd-sub');
  ytdSubEl.textContent = ytdPct !== null ? `전년 동기 대비 ${fmtPct(ytdPct)}` : '—';
  ytdSubEl.className = `kpi-change ${ytdPct > 0 ? 'up' : ytdPct < 0 ? 'down' : 'neutral'}`;

  document.getElementById('kpi-avg').innerHTML = `${fmt(avg12)}<span class="kpi-unit">호</span>`;
  document.getElementById('kpi-avg-sub').textContent = `최근 12개월 평균`;
}

function updateMainChart(labels, values) {
  const ma3 = values.map((v,i,arr) => {
    if (i < 2) return null;
    return (arr[i] + arr[i-1] + arr[i-2]) / 3;
  });

  if (mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById('mainChart').getContext('2d'), {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: '인허가 호수', data: values,
          backgroundColor: 'rgba(240,136,62,0.5)',
          borderColor: COLORS.accent, borderWidth: 1, borderRadius: 2, yAxisID: 'y',
        },
        {
          type: 'line', label: '3개월 이동평균', data: ma3,
          borderColor: COLORS.accent2, borderWidth: 2, pointRadius: 0, tension: 0.4, yAxisID: 'y',
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8b949e', font: { size: 11, family: 'IBM Plex Mono' }, boxWidth: 12 } },
        tooltip: {
          backgroundColor: '#161b22', borderColor: '#21262d', borderWidth: 1,
          titleColor: '#e6edf3', bodyColor: '#8b949e',
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.raw !== null ? fmt(ctx.raw)+'호' : '—'}` }
        }
      },
      scales: {
        x: { ticks: { color: '#484f58', font: { size: 10, family: 'IBM Plex Mono' }, maxTicksLimit: 12 }, grid: { color: 'rgba(33,38,45,0.8)' } },
        y: { ticks: { color: '#484f58', font: { size: 10, family: 'IBM Plex Mono' }, callback: v => v >= 10000 ? (v/10000).toFixed(0)+'만' : v.toLocaleString() }, grid: { color: 'rgba(33,38,45,0.8)' } }
      }
    }
  });
}

function updateTypeChart(allData) {
  // 공공부문 vs 민간부문 (C1_NM 기준)
  const last12Start = allData.length > 12 ? allData[allData.length-13].PRD_DE : allData[0].PRD_DE;

  const publicSum = rawData.filter(d =>
    d.C3_NM === '서울' && d.C1_NM === '공공부문' && d.C2_NM === '총  계' && d.PRD_DE >= last12Start
  ).reduce((s,d) => s + (parseFloat(d.DT)||0), 0);

  const privateSum = rawData.filter(d =>
    d.C3_NM === '서울' && d.C1_NM === '민간부문' && d.C2_NM === '총  계' && d.PRD_DE >= last12Start
  ).reduce((s,d) => s + (parseFloat(d.DT)||0), 0);

  const entries = [['공공부문', publicSum], ['민간부문', privateSum]].filter(([,v]) => v > 0);
  const total = entries.reduce((s,[,v]) => s+v, 0);

  if (typeChart) typeChart.destroy();
  typeChart = new Chart(document.getElementById('typeChart').getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: entries.map(([k])=>k),
      datasets: [{
        data: entries.map(([,v])=>v),
        backgroundColor: [COLORS.accent2, COLORS.accent],
        borderWidth: 0, hoverOffset: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#8b949e', font: { size: 10, family: 'IBM Plex Mono' }, boxWidth: 10, padding: 10 } },
        tooltip: {
          backgroundColor: '#161b22', borderColor: '#21262d', borderWidth: 1,
          callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)}호 (${total ? (ctx.raw/total*100).toFixed(1) : 0}%)` }
        }
      }
    }
  });
}

function updateYoYChart(allData) {
  const years = [...new Set(allData.map(d => d.PRD_DE.slice(0,4)))].sort().slice(-6);
  const months = Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));

  const datasets = years.map((year, yi) => {
    const color = YEAR_COLORS[yi % YEAR_COLORS.length];
    const isLatest = yi === years.length - 1;
    return {
      label: year,
      data: months.map(m => {
        const found = allData.find(d => d.PRD_DE === `${year}${m}`);
        return found ? (parseFloat(found.DT) || null) : null;
      }),
      borderColor: color,
      backgroundColor: 'transparent',
      borderWidth: isLatest ? 2.5 : 1.5,
      pointRadius: isLatest ? 3 : 1,
      pointBackgroundColor: color,
      tension: 0.3,
    };
  });

  if (yoyChart) yoyChart.destroy();
  yoyChart = new Chart(document.getElementById('yoyChart').getContext('2d'), {
    type: 'line',
    data: { labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'], datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8b949e', font: { size: 11, family: 'IBM Plex Mono' }, boxWidth: 20 } },
        tooltip: {
          backgroundColor: '#161b22', borderColor: '#21262d', borderWidth: 1,
          callbacks: { label: ctx => ctx.raw !== null ? ` ${ctx.dataset.label}년: ${fmt(ctx.raw)}호` : ` ${ctx.dataset.label}년: —` }
        }
      },
      scales: {
        x: { ticks: { color: '#484f58', font: { size: 10, family: 'IBM Plex Mono' } }, grid: { color: 'rgba(33,38,45,0.8)' } },
        y: { ticks: { color: '#484f58', font: { size: 10, family: 'IBM Plex Mono' }, callback: v => v >= 10000 ? (v/10000).toFixed(0)+'만' : v.toLocaleString() }, grid: { color: 'rgba(33,38,45,0.8)' } }
      }
    }
  });
}

function updateTable(allData) {
  const recent = allData.slice(-18).reverse();
  const tbody = document.getElementById('data-table');
  tbody.innerHTML = '';

  recent.forEach((row, i) => {
    const val = parseFloat(row.DT) || 0;
    const prevRow = allData[allData.length - i - 2];
    const prevVal = prevRow ? (parseFloat(prevRow.DT) || 0) : null;
    const yoyRow = allData[allData.length - i - 14];
    const yoyVal = yoyRow ? (parseFloat(yoyRow.DT) || 0) : null;
    const slice3 = allData.slice(Math.max(0, allData.length-i-3), allData.length-i);
    const ma = slice3.length ? slice3.reduce((s,d)=>s+(parseFloat(d.DT)||0),0)/slice3.length : null;

    const momPct = prevVal ? ((val-prevVal)/prevVal*100) : null;
    const yoyPct = yoyVal ? ((val-yoyVal)/yoyVal*100) : null;
    const period = row.PRD_DE.replace(/(\d{4})(\d{2})/, '$1년 $2월');

    tbody.innerHTML += `
      <tr>
        <td>${period}</td>
        <td>${fmt(val)}</td>
        <td>${momPct !== null ? `<span class="badge ${momPct>=0?'up':'down'}">${fmtPct(momPct)}</span>` : '—'}</td>
        <td>${yoyPct !== null ? `<span class="badge ${yoyPct>=0?'up':'down'}">${fmtPct(yoyPct)}</span>` : '—'}</td>
        <td>${ma !== null ? fmt(ma) : '—'}</td>
      </tr>`;
  });
}

loadData();
</script>
